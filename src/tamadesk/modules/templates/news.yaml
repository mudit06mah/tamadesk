title: Tech news
blurb: Hacker News stories on your topics, plus any blogs or news feeds you add.
icon: news
params:
  topics:
    label: Topics
    default: startups, programming
    from: interests
  feed:
    label: Extra RSS feed (optional)
    default: ''
module:
  name: News
  icon: news
  every: 3h
  sources:
  - type: hn
    query: ${topics}
    min_points: 40
  - type: rss
    url: ${feed}
  interests:
  - ${topics}
  actions:
  - save
  - skip
  - summarize
  - open
  workflows:
  - label: Weekly digest
    prompt: Write a short digest of the stories below, grouped by theme, one line
      each on why it matters to me. Save it with write_note.
  - label: Write a post
    prompt: Pick the most interesting story below and draft a short opinion post about
      it in my voice. Save it with write_note.
