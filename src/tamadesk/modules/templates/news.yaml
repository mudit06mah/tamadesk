title: Tech news
blurb: Hacker News stories on your topics, plus any blogs or news feeds you add.
icon: news
params:
  topics: {label: "Topics", default: "startups, programming", from: interests}
  feed: {label: "Extra RSS feed (optional)", default: ""}
module:
  name: News
  icon: news
  view: feed
  every: 3h
  sources:
    - {type: hn, query: "${topics}", min_points: 40}
    - {type: rss, url: "${feed}"}
  interests: ["${topics}"]
  actions: [save, skip, summarize, open]
